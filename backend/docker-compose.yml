# Dev-окружение: PostgreSQL + MinIO (вместо Yandex Object Storage)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: akty
      POSTGRES_PASSWORD: akty
      POSTGRES_DB: akty
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
