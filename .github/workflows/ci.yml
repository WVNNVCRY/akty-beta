name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Сборка и тесты (API + UI)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: akty, POSTGRES_PASSWORD: akty, POSTGRES_DB: akty }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U akty" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://akty:akty@localhost:5432/akty?schema=public
      JWT_SECRET: ci-secret
      STORAGE: local
      STORAGE_DIR: ./storage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Фронтенд — демо (Pages) и серверный режим
        run: npm ci && npm run build && npm run build:api

      - name: Backend — зависимости, миграции, сборка
        working-directory: backend
        run: |
          npm ci
          npx prisma migrate deploy
          npm run build

      - name: API e2e (43 проверки)
        working-directory: backend
        run: |
          SEED_DEMO_OBJECTS=1 npx tsx prisma/seed.ts
          node dist/main.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:3000/api/health && break; sleep 1; done
          npx tsx test/api.e2e.ts

      - name: UI e2e в браузере (17 проверок)
        working-directory: backend
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
          SEED_DEMO_OBJECTS=1 npx tsx prisma/seed.ts
          python test/ui-api.py

      - name: Лог сервера
        if: failure()
        working-directory: backend
        run: tail -100 server.log

  docker:
    name: Docker-образ и docker compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Запуск как на сервере
        run: |
          printf 'POSTGRES_PASSWORD=%s\nJWT_SECRET=%s\n' "$(openssl rand -hex 16)" "$(openssl rand -hex 32)" > deploy/.env
          C="docker compose -f deploy/docker-compose.yml --env-file deploy/.env"
          $C up -d --build
          for i in $(seq 1 60); do curl -sf localhost/api/health && break; sleep 3; done
          curl -sf localhost/api/health
          curl -sf localhost/ | grep -q '<div id="root">'
          $C exec -T -e ADMIN_LOGIN=admin -e ADMIN_PASSWORD=ci-password-1 app npx tsx prisma/init.ts
          curl -sf -X POST localhost/api/auth/login -H 'Content-Type: application/json' -d '{"login":"admin","password":"ci-password-1"}' | grep -q token
          $C exec -T app npx tsx prisma/seed.ts && exit 1 || echo "seed без SEED_RESET заблокирован — ок"
          echo "Docker OK"
      - name: Логи
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env logs --tail 100
