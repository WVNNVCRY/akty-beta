# Локальный стенд для тестирования: PostgreSQL 17 + приложение (API + веб) на http://localhost:8080
# Пароли здесь тестовые и годятся только для локального компьютера. Для сервера используйте deploy/.
# Запуск: ./start-local.sh (Linux/macOS) или start-local.bat (Windows) из корня проекта.
name: akty-local
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: akty
      POSTGRES_PASSWORD: akty-local
      POSTGRES_DB: akty
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akty -d akty"]
      interval: 3s
      timeout: 5s
      retries: 30

  app:
    build: { context: .., dockerfile: Dockerfile }
    image: akty-app-local
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://akty:akty-local@db:5432/akty?schema=public
      JWT_SECRET: local-test-secret-not-for-production
      STORAGE: local
    volumes: [storage:/data/storage]
    ports: ["8080:3000"]

volumes:
  pgdata:
  storage:
