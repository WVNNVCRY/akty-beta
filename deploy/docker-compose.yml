# Сервер: PostgreSQL 17 + приложение + Caddy (HTTPS автоматически, если задан DOMAIN)
# Запуск из корня репозитория:  docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: akty
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: akty
      POSTGRES_DB: akty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в deploy/.env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akty -d akty"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: { context: .., dockerfile: Dockerfile }
    image: akty-app
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://akty:${POSTGRES_PASSWORD}@db:5432/akty?schema=public
      JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в deploy/.env}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      STORAGE: ${STORAGE:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    volumes: [storage:/data/storage]
    expose: ["3000"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from ${DOMAIN:-:80} --to app:3000
    volumes: [caddy_data:/data, caddy_config:/config]

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
